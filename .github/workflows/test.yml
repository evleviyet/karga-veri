name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test
      - name: Zamanlayıcı (Cloudflare Worker) testi
        run: node --test scheduler/worker.test.mjs
