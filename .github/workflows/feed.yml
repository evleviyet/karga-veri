# Kaynakları 30 dakikada bir okur, data/ altına JSON yazar, değiştiyse commit'ler.
name: feed
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Feed'i üret
        run: dart run bin/build_feed.dart
      - name: Değiştiyse commit'le
        run: |
          git config user.name "karga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "feed: $(date -u +'%F %R') UTC"
            git push
          fi
