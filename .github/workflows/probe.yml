# GitHub runner'ından tüm kaynaklara erişim testi. Elle ya da kaynak kodu /
# kayıt defteri değişince çalışır; feed'i yayımlamadan üretir. Her kaynağın
# durumu iş özetinde tablo, özet ve hatalar uyarı notu (annotation) olarak görünür.
# Bulut IP'lerini engelleyen kaynaklar burada "degraded" görünür.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'registry/**'
      - 'tool/annotate.sh'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Kaynakları oku (yayımlamadan)
        run: dart run bin/build_feed.dart probe-site
      - name: Sonuç tablosu
        run: |
          {
            echo "### Runner erişim testi ($(date -u +%F' '%T) UTC)"
            echo "| Kaynak | Tür | Durum | Kayıt | Süre (ms) | Hata |"
            echo "|---|---|---|---|---|---|"
            jq -r '.sources | to_entries[] | "| \(.value.name) | \(.value.kind) | \(.value.status) | \(.value.count) | \(.value.ms) | \(.value.error // "") |"' probe-site/data/v2/meta.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - name: Uyarı notları
        run: bash tool/annotate.sh probe-site "Probe özeti"
      # GEÇİCİ: engellenen kaynakların alternatif uç noktalarına runner'dan erişim.
      - name: Alternatif uç noktalar
        run: |
          check() {
            url="$1"; shift
            code=$(curl -s -o /dev/null -m 25 --connect-timeout 10 -A "Mozilla/5.0" -w '%{http_code}' "$@" "$url" || true)
            echo "::notice title=Erişim::${code:-000} $url"
          }
          check https://www.uedas.com.tr/planli-kesintiler/sec.asp -X POST -d ilce=2077
          check https://www.uedas.com.tr/tr/kesintiler
          check https://edrimsapi.uedas.com.tr/
          check https://www.meramedas.com.tr/kesintiler/ajax
          check https://cc.meramedas.com.tr/
          check https://www.yedas.com/
          check https://online.yedas.com/
          check https://www.deski.gov.tr/
          check https://sukesinti.deski.gov.tr/kesintiler.json
