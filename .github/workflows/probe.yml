# Faz 0: GitHub runner'ından kaynaklara erişim testi (elle çalıştırılır).
# Sonuç, iş özetindeki tabloda görünür. Bulut IP'leri engelleniyorsa tablo bunu gösterir.
name: probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynaklara erişim testi
        run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          {
            echo "### Runner erişim testi ($(date -u +%F' '%T) UTC)"
            echo "| Kaynak | HTTP | Boyut | Süre | Beklenen içerik | Gövde başı |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          probe() {  # ad url beklenen-metin
            res=$(curl -sL -m 40 -A "$UA" -o /tmp/out -w "%{http_code}|%{size_download}|%{time_total}" "$2" || echo "000|0|0")
            IFS='|' read -r code size secs <<< "$res"
            if grep -aqi -- "$3" /tmp/out 2>/dev/null; then ok="✅ var"; else ok="❌ yok"; fi
            head_txt=$(head -c 70 /tmp/out 2>/dev/null | tr -d '\n\r|' | tr -c '[:print:]' '?')
            echo "| $1 | $code | ${size}B | ${secs}s | $ok | $head_txt |" >> "$GITHUB_STEP_SUMMARY"
          }

          START=$(date -u -d '1 day ago' +%F); END=$(date -u +%F)
          probe "ASKİ su kesintisi"   "https://www.aski.gov.tr/tr/Kesinti.aspx" "Arıza Tarihi"
          probe "ABB duyurular"        "https://www.ankara.bel.tr/duyurular" "/duyurular/"
          probe "Ankara Valiliği"      "https://www.ankara.gov.tr/duyurular" "duyuru"
          probe "Başkent EDAŞ"         "https://www.baskentedas.com.tr/planli-kesintiler" "kesinti"
          probe "AFAD deprem"          "https://deprem.afad.gov.tr/apiv2/event/filter?start=$START&end=$END&minmag=2&limit=3" "magnitude"
          probe "USGS deprem"          "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=1&minlatitude=35&maxlatitude=42&minlongitude=26&maxlongitude=45" "features"
          probe "Kandilli"             "http://www.koeri.boun.edu.tr/scripts/lasteq.asp" "Lat"
          probe "Open-Meteo"           "https://api.open-meteo.com/v1/forecast?latitude=39.93&longitude=32.86&current=temperature_2m" "temperature_2m"
          probe "kanari (yangın)"      "https://kanari.io/en/api" "fire"

          echo "----- SONUÇ -----"; cat "$GITHUB_STEP_SUMMARY"
